<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1522"/>
    </linearGradient>
    <radialGradient id="g1" cx="18%" cy="25%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="55%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="16" fill="url(#g1)"/>
  <rect width="1200" height="280" rx="16" fill="url(#g2)"/>
  <rect width="1200" height="280" rx="16" fill="url(#g3)"/>
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left geometric 6-node suite mark -->
  <g transform="translate(64, 70)">
    <rect width="136" height="136" rx="28" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="44" cy="46" r="10" fill="#38bdf8"/>
    <circle cx="92" cy="46" r="10" fill="#34d399"/>
    <circle cx="44" cy="90" r="10" fill="#a78bfa"/>
    <circle cx="92" cy="90" r="10" fill="#fbbf24"/>
    <circle cx="68" cy="68" r="12" fill="#f8fafc"/>
    <line x1="44" y1="46" x2="68" y2="68" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.65"/>
    <line x1="92" y1="46" x2="68" y2="68" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.65"/>
    <line x1="44" y1="90" x2="68" y2="68" stroke="#a78bfa" stroke-width="2.5" stroke-opacity="0.65"/>
    <line x1="92" y1="90" x2="68" y2="68" stroke="#fbbf24" stroke-width="2.5" stroke-opacity="0.65"/>
  </g>

  <!-- Main Heading -->
  <text x="236" y="108" fill="#f8fafc" font-family="Segoe UI, Inter, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Rıdvan Ahraz <tspan fill="#38bdf8" font-weight="600">@rodvay</tspan>
  </text>

  <text x="236" y="148" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="21" font-weight="500">
    Native Zero-Bloat Windows 10/11 Open-Source Utility Suite
  </text>
  <text x="236" y="178" fill="#94a3b8" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="16">
    原生零臃肿 Windows 开源工具全家桶  ·  Kurulumsuz, Tek Dosya Yerel Windows Araçları
  </text>

  <!-- Pills -->
  <g transform="translate(236, 202)" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14" font-weight="700">
    <rect x="0" y="0" width="182" height="34" rx="8" fill="#162032" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="91" y="22" fill="#34d399" text-anchor="middle">ZeroBox + 6 Micro-Apps</text>

    <rect x="194" y="0" width="154" height="34" rx="8" fill="#162032" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="271" y="22" fill="#38bdf8" text-anchor="middle">~50–230 KB Each</text>

    <rect x="360" y="0" width="140" height="34" rx="8" fill="#162032" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="430" y="22" fill="#a78bfa" text-anchor="middle">Zero Electron</text>

    <rect x="512" y="0" width="144" height="34" rx="8" fill="#162032" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="584" y="22" fill="#fbbf24" text-anchor="middle">EN / TR / 简体中文</text>

    <rect x="668" y="0" width="118" height="34" rx="8" fill="#162032" stroke="#f87171" stroke-opacity="0.7" stroke-width="1.2"/>
    <text x="727" y="22" fill="#f87171" text-anchor="middle">MIT License</text>
  </g>
</svg>
